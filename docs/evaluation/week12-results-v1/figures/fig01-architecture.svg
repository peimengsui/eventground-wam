   </g>
   <g id="text_7">
    <text style="fill: #117c83; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="762.624" y="152.748233" transform="rotate(-0 762.624 152.748233)">Coupling + same action head</text>
   </g>
   <g id="text_8">
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(703.895484 180.81793)">Attend to predicted future</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(688.760016 192.605609)">Refine and execute eight actions</text>
   </g>
   <g id="text_9">
    <text style="fill: #18344a; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="528.264" y="111.23352" transform="rotate(-0 528.264 111.23352)">M3 / M4 inference path</text>
   </g>
   <g id="text_10">
    <text style="fill: #18344a; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="220.248" y="300.893993" transform="rotate(-0 220.248 300.893993)">Week 9 comparison</text>
   </g>
   <g id="text_11">
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(186.550734 348.92153)">B0: action only</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(71.969484 360.70921)">M1 / M2: pixel / JEPA auxiliary training; no future core at inference</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(126.452531 372.496889)">M3 / M4: pixel / JEPA coupling; fixed h = 8</text>
   </g>
   <g id="text_12">
    <text style="fill: #be5545; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="528.264" y="300.893993" transform="rotate(-0 528.264 300.893993)">Week 11 event branch</text>
   </g>
   <g id="text_13">
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(477.456891 348.92153)">Selected SFT predictor</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(473.687438 360.70921)">Next new event + onset</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(462.473297 372.496889)">Nearest h ∈ {2, 4, 8, 16, 32}</text>
   </g>
   <g id="text_14">
    <text style="fill: #be5545; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="762.624" y="300.893993" transform="rotate(-0 762.624 300.893993)">Week 11 deployment arms</text>
   </g>
   <g id="text_15">
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(681.761109 348.92153)">Original M4: no event branch, h = 8</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(698.425875 360.70921)">Event-running control: h = 8</text>
    <text style="fill: #18344a; font: 9px 'DejaVu Sans'" transform="translate(702.041344 372.496889)">Adaptive: event-selected h</text>
   </g>
   <g id="text_16">
    <text style="fill: #be5545; font: 9px 'DejaVu Sans'; text-anchor: start" x="540.3168" y="243.153792" transform="rotate(-0 540.3168 243.153792)">h only</text>
   </g>
   <g id="text_17">
    <text style="fill: #687785; font: 10px 'DejaVu Sans'; text-anchor: middle" x="762.624" y="109.117152" transform="rotate(-0 762.624 109.117152)">One refinement per query</text>
   </g>
