[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventground-wam"
version = "0.1.0"
description = "Temporally grounded future representations for robust VLA/WAM policies"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
