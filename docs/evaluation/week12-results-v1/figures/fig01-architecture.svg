  <g id="text_18">
   <text style="fill: #18344a; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="51.48" y="36.793031" transform="rotate(-0 51.48 36.793031)">Future representations and temporal routing</text>
  </g>
  <g id="text_19">
   <text style="fill: #687785; font: 10px 'DejaVu Sans'; text-anchor: start" x="51.48" y="54.341387" transform="rotate(-0 51.48 54.341387)">Figure 1  |  Five-arm policy study, followed by a separate three-arm M4 deployment study</text>
  </g>
  <g id="text_20">
   <text style="fill: #687785; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.48" y="464.508" transform="rotate(-0 51.48 464.508)">Coupled policies use detached executable proposals padded to 32 steps. Replanning remains every eight actions at 20 Hz.</text>
  </g>
  <g id="text_21">
   <text style="fill: #687785; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.48" y="479.412" transform="rotate(-0 51.48 479.412)">Separate event inference uses the same current observations. No demonstration future action or target enters the rollout action path.</text>
  </g>
